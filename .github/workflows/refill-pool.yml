name: Refill Quest Pool

# Runs the pool generator on GitHub's servers (6-hour limit — no Vercel 60s ceiling).
# Fills starved pools and rotates stale quests once per day.

on:
  # Daily at 07:00 UTC (same cadence the old Vercel cron used).
  schedule:
    - cron: '0 7 * * *'
  # Manual "Run workflow" button in the Actions tab — use this to fill on demand.
  workflow_dispatch:

# Prevent two runs overlapping (e.g. a manual run during the scheduled one).
concurrency:
  group: refill-pool
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # generous; cold-start backfill of 200+ quests needs headroom. Steady-state daily runs finish in minutes.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 has native WebSocket support, which @supabase/supabase-js
          # needs when it initializes its realtime client. Node 20 does not,
          # and throws on createClient(). 22 avoids that entirely.
          node-version: '22'

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so a lockfile that's slightly out of
        # sync with package.json doesn't fail the run. Only supabase-js is needed
        # at runtime; this installs it reliably regardless of lockfile drift.
        run: npm install --no-audit --no-fund

      - name: Run pool refill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refill-pool.mjs
